[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-otp"
version = "1.3.4"
description = "Universal zero-LLM email OTP & 2FA extraction and autofill engine powered by local Spark Desktop"
readme = "README.md"
authors = [{ name = "V" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/vecyang1/spark-otp"
Repository = "https://github.com/vecyang1/spark-otp.git"
Issues = "https://github.com/vecyang1/spark-otp/issues"

[project.scripts]
spark-otp = "spark_otp.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
